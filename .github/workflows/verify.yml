name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      # Sequential npm ci for API, RAG, MCP and mobile, then each package's
      # npx --no-install tsc --noEmit and npm test. Install all before checking:
      # API uses the in-memory MCP stdio fixture; MCP imports API sources.
      - name: Install, typecheck and test the four packages
        run: node scripts/verify-local.mjs
      # Only test/*.test.ts: SQL/HTTP clients are fixtures or local test servers.
      # Excluded: API auth *.mts SQL/DB/HTTP/integration/setup/evidence scripts,
      # test:unified and test:ccd:http (real DB/runtime/configuration required).
      # Excluded: RAG test:db and test:e2e:ingestion (PostgreSQL, Ollama).
      # No eval runners, N8N workflows, Docker, external mail or private secrets.
      # Mobile tests cover services; Android/device and human validation are excluded.
