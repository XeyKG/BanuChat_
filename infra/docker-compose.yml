version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: banuchat-postgres
    environment:
      POSTGRES_DB: banuchat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgvector:
    image: pgvector/pgvector:pg16
    container_name: banuchat-pgvector
    environment:
      POSTGRES_DB: banuchat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data

  n8n:
    image: n8nio/n8n:latest
    container_name: banuchat-n8n
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  postgres_data:
  pgvector_data:
  n8n_data:
