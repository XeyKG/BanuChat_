# Configuración de diseño local; no aplica migraciones automáticamente.
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: banuchat-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB en el entorno local}
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en el entorno local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define una clave local no versionada}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data

  n8n:
    image: n8nio/n8n:2.40.5
    container_name: banuchat-n8n
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Define una clave local no versionada}
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  pgvector_data:
  n8n_data:
