    "/calendar/events": {
      "get": {
        "operationId": "list_calendar_events",
        "summary": "Consultar calendario sintético sin invocar al agente",
        "description": "Días civiles inclusivos en America/Bogota, zona canónica técnica del prototipo, no afirmación institucional: date_to >= date_from, diferencia + 1 <= 366 días. El backend transforma 00:00 de date_from y 00:00 del día posterior a date_to en esa zona a instantes con zona y filtra starts_at con inicio incluido y fin excluido, no solapamiento. Timestamps de salida RFC 3339 con offset. REST y MCP comparten esta misma semántica civil en America/Bogota; una futura capa compartida recibirá límites normalizados. Orden starts_at y event_key ascendentes. Solo release vigente. En conocimiento ccd_local devuelve 403: no hay datos personales respaldados y no se usa fallback sintético.",
        "parameters": [
          {
            "name": "date_from",
            "in": "query",
            "required": true,
            "description": "Primer día civil incluido en America/Bogota.",
            "schema": {
              "type": "string",
              "format": "date"
            }
          },
          {
            "name": "date_to",
            "in": "query",
            "required": true,
            "description": "Último día civil incluido en America/Bogota; máximo 366 días contando ambos extremos.",
            "schema": {
              "type": "string",
              "format": "date"
            }
          },
          {
            "name": "event_types",
            "in": "query",
            "required": false,
            "description": "Parámetro repetido por valor. Omitido: todos; vacío, duplicados o valores desconocidos: 400.",
            "schema": {
              "type": "array",
              "minItems": 1,
              "maxItems": 3,
              "uniqueItems": true,
              "items": {
                "type": "string",
                "enum": [
                  "course_session",
                  "announcement_deadline",
                  "general"
                ]
              }
            },
            "style": "form",
            "explode": true
          },
          {
            "$ref": "#/components/parameters/limit"
          }
        ],
        "responses": {
          "200": {
            "description": "Eventos estructurados; array vacío es éxito.",
            "headers": {
              "Cache-Control": {
                "$ref": "#/components/headers/no_store"
              },
              "Vary": {
                "$ref": "#/components/headers/vary_authorization"
              }
            },
            "content": {
