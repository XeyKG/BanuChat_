{
  "openapi": "3.1.0",
  "jsonSchemaDialect": "https://json-schema.org/draft/2020-12/schema",
  "info": {
    "title": "BanuChat REST API v2 — cuentas ficticias y conocimiento explícito",
    "version": "4.0.0",
    "description": "Contrato AUTH-P0 con delta de recuperación BCH-D31/AUTH-P3.1. Autenticación propia BanuChat con UID sintético y contraseña independiente; no valida credenciales UNAB. Recuperación por UID y código de ocho dígitos al contacto privado verificado; capturador local solo como doble, sin acreditar entrega externa. Sin registro público, administración cliente, federación, Agent/ReAct o MCP conversacional. Normativa completa: api-contract-v2.md y ../../infra/db/auth-permissions.md. v1 permanece congelada y no se monta en el despliegue protegido. BCH-D37/CCD-AUTH-I1B: modo de conocimiento explícito por despliegue; contexto técnico CCD sin identidad institucional. Recuperación de correo suspendida."
  },
  "servers": [
    {
      "url": "/api/v2",
      "description": "Base relativa; TLS obligatorio fuera del canal local aislado autorizado."
    }
  ],
  "security": [
    {
      "banu_bearer": []
    }
  ],
