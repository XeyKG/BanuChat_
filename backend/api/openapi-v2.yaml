      "post": {
        "operationId": "send_message",
        "summary": "Enviar mensaje y recibir respuesta del agente",
        "description": "Solo content de 1–4000 puntos de código no blancos; principal de sesión y owner antes de cargar contexto/generar. Perfil de conversación compatible con binding autorizado en current. Router/fast path o Document RAG fuera de transacción. Antes de commit bloquear cuenta/sesión, revalidar versión/revocación/permiso/owner y mantener la sentencia atómica actual con gates de release y ordinal, user+assistant+citas. 201 después de commit; 401 si revocación gana. Conflicto de release/ordinal/actividad: 409. Sin Idempotency-Key ni retry ciego tras resultado incierto; reconciliar con historial.",
