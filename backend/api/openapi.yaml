          }
        },
        "content": {
          "application/json": {
            "schema": {
              "allOf": [
                {
                  "$ref": "#/components/schemas/error_response"
                },
                {
                  "properties": {
                    "error": {
                      "properties": {
                        "code": {
                          "const": "CONFLICT"
                        }
                      }
                    }
                  }
                }
              ]
            }
          }
        }
      },
      "error_503": {
        "description": "DEPENDENCY_UNAVAILABLE: Dependencia temporalmente indisponible; POST requiere reconciliación antes de reintentar.",
        "headers": {
          "Cache-Control": {
            "$ref": "#/components/headers/no_store"
          }
        },
        "content": {
          "application/json": {
            "schema": {
              "allOf": [
                {
                  "$ref": "#/components/schemas/error_response"
                },
                {
                  "properties": {
                    "error": {
                      "properties": {
                        "code": {
