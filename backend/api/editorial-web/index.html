<!doctype html>
<html lang="es">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <title>Panel editorial | BanuChat</title>
 <link rel="stylesheet" href="/api/v2/editorial/editor.css">
 <script type="module" src="/api/v2/editorial/editor.js"></script>
</head>
<body>
 <header class="top"><div class="brand"><strong>Banu<span>Chat</span></strong><span>Centro de Competencias Digitales</span></div><a href="/announcements">Abrir Banu al Día</a><button type="button" id="logout" class="secondary" hidden>Cerrar sesión</button></header>
 <main>
  <section id="access" class="access" aria-labelledby="access-title">
   <div><p class="eyebrow">Banu al Día</p><h1 id="access-title">Panel editorial</h1><p class="lead">Publica noticias y documentos del Centro de Competencias Digitales.</p></div>
   <form id="login" class="card">
    <h2>Acceso de administración</h2>
    <label for="username">Usuario</label><input id="username" name="username" autocomplete="username" required maxlength="64">
    <label for="password">Contraseña</label><input id="password" name="password" autocomplete="current-password" type="password" required maxlength="128">
    <button>Iniciar sesión</button>
    <p role="alert" id="login-error"></p>
   </form>
  </section>
  <section id="workspace" hidden aria-labelledby="workspace-title">
   <div class="workspace-title"><div><p class="eyebrow">Panel editorial</p><h1 id="workspace-title">Banu al Día</h1></div><button type="button" id="new">Nueva noticia</button></div>
   <p id="feedback" role="status" aria-live="polite"></p>
   <div class="columns">
    <section class="card listings" aria-labelledby="list-title"><h2 id="list-title">Noticias</h2><div id="list"></div></section>
    <form id="editor" class="card" aria-labelledby="editor-title">
     <div class="editor-title"><h2 id="editor-title">Nueva noticia</h2><span id="state" class="pill">Borrador</span></div>
     <label for="title">Título</label><input id="title" required maxlength="160">
     <label for="message">Contenido</label><textarea id="message" required maxlength="8000" rows="11"></textarea>
     <label for="attachment">Archivo adjunto <span class="muted">(opcional)</span></label>
     <p class="hint" id="file-hint">PDF o Markdown de hasta 2 MB.</p>
     <div id="current-file" hidden><a id="file-link">Descargar adjunto</a><label class="check"><input type="checkbox" id="remove"> Quitar el adjunto actual</label></div>
     <input id="attachment" type="file" aria-describedby="file-hint" accept="application/pdf,text/markdown,.pdf,.md">
     <div class="actions"><button type="button" id="archive" class="secondary" hidden>Archivar</button><button type="button" id="draft" class="secondary">Guardar borrador</button><button type="submit" id="publish">Publicar noticia</button></div>
     <p id="editor-error" role="alert"></p>
    </form>
   </div>
  </section>
 </main>
</body>
</html>
